name: iOS source build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app for device
        run: xcodebuild -project Coralcord.xcodeproj -scheme Coralcord -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - name: Upload unsigned app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Coralcord-unsigned-app
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphoneos/Coralcord.app
