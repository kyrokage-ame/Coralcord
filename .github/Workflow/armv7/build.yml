name: Coralcord armv7 (template — see .github/workflows/build-armv7.yml)

on:
  workflow_dispatch:

# GitHub Actions does not discover nested YAML here. The runnable workflow is
# mirrored under .github/workflows and invokes scripts from this directory.
jobs:
  source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build armv7 IPA on Linux
        run: bash .github/Workflow/armv7/build-linux.sh
