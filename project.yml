name: Coralcord
options:
  bundleIdPrefix: app.coralcord
  deploymentTarget:
    iOS: "15.0"
targets:
  Coralcord:
    type: application
    platform: iOS
    sources:
      - Sources/Cordial
      - Assets.xcassets
    info:
      properties:
        NSMicrophoneUsageDescription: Coralcord uses the microphone during Discord voice calls.
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.coralcord.client
        PRODUCT_NAME: Coralcord
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1.0.0"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Coralcord
        INFOPLIST_KEY_CFBundleShortVersionString: "1.0.0"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
